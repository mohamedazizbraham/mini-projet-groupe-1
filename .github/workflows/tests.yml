name: Tests et image Docker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t stages-api:test .
      - name: Verification du conteneur
        shell: bash
        run: |
          export AUTH_USERNAME=ci-test
          export AUTH_PASSWORD=Test-only-password-123456
          export JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          export AUTH_PASSWORD_HASH=$(python -c 'import os; from pwdlib import PasswordHash; print(PasswordHash.recommended().hash(os.environ["AUTH_PASSWORD"]))')
          docker run -d --name stages-test -p 8000:8000 -e AUTH_USERNAME -e AUTH_PASSWORD_HASH -e JWT_SECRET_KEY stages-api:test
          trap 'docker logs stages-test; docker rm -f stages-test' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          python scripts/smoke_test.py http://localhost:8000
